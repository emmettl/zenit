name: Check ZENIT
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    # Current stable native ARM image; pinned Playwright includes macOS 26 WebKit.
    runs-on: macos-26
    # The 198-case native browser suite reached 191 passes at the old 15-minute limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci
      - run: npm run check:stack
      - run: npm run check
      # Native WebKit/Chromium runtimes avoid the Ubuntu package-mirror dependency.
      - run: npx playwright install chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-checks
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: zenit-site
          path: dist
          retention-days: 7
